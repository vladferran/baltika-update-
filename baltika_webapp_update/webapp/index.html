<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Балтика · смены</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* ПАЛИТРА БАЛТИКИ. Значения приближённые: при наличии брендбука замени HEX здесь, остальное подстроится. */
:root{
  --bg:#060d24;
  --brand-blue:#1f4fd1; --brand-blue-rgb:31,79,209;    /* основной акцент: синий, как в личном кабинете */
  --brand-gold:#e6b14a; --brand-gold-rgb:230,177,74;   /* ночные смены, предупреждения */
  --brand-black:#08102a;
  --brand-white:#f2f6ff;
  --ion:var(--brand-blue);--ion-rgb:var(--brand-blue-rgb);
  --night:var(--brand-gold);--night-rgb:var(--brand-gold-rgb);
  --day:var(--ion);
  --cta:var(--brand-white);--cta-ink:var(--brand-black);
  --st-steel:rgba(255,255,255,.06);
  --st-navy:rgba(14,26,66,.6);
  --st-ink:var(--brand-white);--muted:#8f9bb8;--edge:rgba(255,255,255,.10);
  --off:#4d5a7a;--warn:var(--brand-gold);--bad:#ff6b6b;
  --green:#4ade80;--green-rgb:74,222,128;
  --r:18px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eef3fb; --cta:var(--brand-black); --cta-ink:#fff; --st-steel:rgba(0,0,0,.04);
    --st-navy:rgba(255,255,255,.72); --st-ink:var(--brand-black); --muted:#5b6a88; --edge:rgba(0,0,0,.08);
    color-scheme:light;
  }
}
:root[data-theme="dark"]{ --bg:#060d24; --st-ink:var(--brand-white); color-scheme:dark; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--st-ink)}
body{
  font-family:Barlow,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.4;
  min-height:100vh;overflow-x:hidden;padding:env(safe-area-inset-top) 0 calc(104px + env(safe-area-inset-bottom));
  background:
    radial-gradient(900px 500px at 85% -10%, rgba(var(--ion-rgb),.13), transparent 60%),
    var(--bg);
}
h1,h2,.cond{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;letter-spacing:.02em;margin:0}
main{padding:16px}
.view{display:none;animation:in .28s ease both}
.view.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* верхняя панель: стекло, компактный wordmark с золотыми тонкими дугами, поиск и меню справа */
.top{
  position:sticky;top:0;z-index:4;margin:-16px -16px 14px;padding:10px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:linear-gradient(180deg,rgba(10,18,48,.80),rgba(10,18,48,.48));
  border-bottom:1px solid rgba(var(--brand-gold-rgb),.22);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 30px rgba(0,0,0,.25);
  backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);
}
.wm{position:relative;padding:9px 10px;min-width:0}
.wm .arc{position:absolute;left:0;width:100%;height:10px;fill:none;stroke:var(--brand-gold);stroke-width:1.1;overflow:visible}
.wm .arc.top{top:0}
.wm .arc.bot{bottom:0}
.wm img{display:block;height:30px;width:auto}
.wm-text{display:flex;align-items:center;gap:7px;color:#fff;font:italic 700 25px/1 Georgia,"Times New Roman",serif;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.wm-text svg{width:30px;height:22px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round}
.top-l{min-width:0;flex:1}
.top-l h1{font-size:26px;text-transform:uppercase;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-l .muted{display:block;font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtns{display:flex;gap:4px}
.ib{
  appearance:none;border:0;background:transparent;color:#fff;cursor:pointer;
  width:40px;height:40px;border-radius:50%;display:grid;place-items:center;transition:transform .15s ease,background .25s ease;
}
.ib:active{transform:scale(.9);background:rgba(255,255,255,.08)}
.ib svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* стекло: мягкий блик сверху, светлая кромка, лёгкий сдвиг блика при нажатии */
.card{
  position:relative;isolation:isolate;overflow:hidden;
  background:linear-gradient(160deg,rgba(255,255,255,.085),rgba(255,255,255,.012) 45%,rgba(255,255,255,0)),var(--st-navy);
  border:1px solid var(--edge);border-radius:var(--r);padding:16px;margin-bottom:12px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10),inset 0 -1px 0 rgba(0,0,0,.18),0 10px 26px rgba(0,0,0,.16);
  backdrop-filter:blur(14px) saturate(170%);-webkit-backdrop-filter:blur(14px) saturate(170%);
  transition:transform .18s ease,box-shadow .25s ease;
}
.card::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.26),rgba(255,255,255,.03) 35%,rgba(255,255,255,0) 60%,rgba(255,255,255,.10));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
}
.card::after{
  content:"";position:absolute;top:-40%;left:-70%;width:40%;height:180%;transform:rotate(18deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);
  transition:left .9s ease;pointer-events:none;
}
.card.tap{cursor:pointer}
.card.tap:active{transform:scale(.99)}
.card.tap:active::after{left:130%}
/* появление карточек по очереди */
.view.on > :nth-child(1){animation:rise .42s cubic-bezier(.2,.7,.2,1) backwards}
.view.on > :nth-child(2){animation:rise .42s cubic-bezier(.2,.7,.2,1) .05s backwards}
.view.on > :nth-child(3){animation:rise .42s cubic-bezier(.2,.7,.2,1) .10s backwards}
.view.on > :nth-child(4){animation:rise .42s cubic-bezier(.2,.7,.2,1) .15s backwards}
.view.on > :nth-child(n+5){animation:rise .42s cubic-bezier(.2,.7,.2,1) .20s backwards}
@keyframes rise{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
.muted{color:var(--muted);font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hdr{display:flex;justify-content:space-between;align-items:baseline;margin:4px 2px 14px}
.hdr h1{font-size:30px;text-transform:uppercase}
.hdr .muted{font-size:13px}

.sbadge{
  display:inline-block;font:700 13px/1 "Barlow Condensed",sans-serif;letter-spacing:.08em;
  padding:6px 12px 6px 10px;transform:skewX(-12deg);color:#06070a;text-transform:uppercase;
}
.sbadge span{display:inline-block;transform:skewX(12deg)}
.sbadge.day{background:var(--day)}
.sbadge.night{background:var(--night);color:var(--brand-black)}
.sbadge.off{background:var(--off);color:#fff}
.sbadge.warn{background:var(--warn)}
/* дневные и ночные смены: иконка мягко светится своим цветом */
.sbadge.glow{animation:dyglow 3.2s ease-in-out infinite}
.sbadge.glow.night{animation-name:nglow}
@keyframes dyglow{
  0%,100%{box-shadow:0 0 0 0 rgba(var(--ion-rgb),0)}
  50%{box-shadow:0 0 10px 2px rgba(var(--ion-rgb),.38)}
}
@keyframes nglow{
  0%,100%{box-shadow:0 0 0 0 rgba(var(--night-rgb),0)}
  50%{box-shadow:0 0 10px 2px rgba(var(--night-rgb),.40)}
}

.countdown{font:800 46px/1 "Barlow Condensed",sans-serif;letter-spacing:.01em;margin:10px 0 4px;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:4px;background:var(--edge);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--ion);width:0;transition:width .6s ease}

.btn{
  appearance:none;border:0;cursor:pointer;font:700 16px/1 "Barlow Condensed",sans-serif;letter-spacing:.06em;
  text-transform:uppercase;padding:14px 16px;border-radius:12px;background:var(--cta);color:var(--cta-ink);
  transition:transform .12s ease,opacity .2s;width:100%;
}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--st-ink);border:1px solid var(--edge)}
.btn.on{background:var(--ion);color:#06070a}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}

/* полоса дней: горизонтальная прокрутка пальцем и колесом мыши */
.strip{
  display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;
  overscroll-behavior-x:contain;touch-action:pan-x;scrollbar-width:none;
  margin:0 -16px;padding:4px 16px 8px;
}
.strip::-webkit-scrollbar{display:none}
.dcell{
  flex:0 0 74px;scroll-snap-align:start;border-radius:14px;padding:10px 4px 9px;text-align:center;
  border:1px solid var(--edge);background:var(--st-steel);font-size:12px;cursor:pointer;
  transition:transform .22s ease,border-color .22s ease,background .22s ease;
}
.dcell b{display:block;font:700 22px/1.1 "Barlow Condensed",sans-serif}
.dcell .sbadge{margin-top:6px;font-size:10px;letter-spacing:.03em;padding:4px 6px 4px 5px;white-space:nowrap}
.dcell.today{box-shadow:inset 0 0 0 1px var(--ion)}
.dcell.sel{border-color:var(--ion);transform:translateY(-2px);background:linear-gradient(160deg,rgba(var(--ion-rgb),.22),var(--st-steel))}
.dcell.off-k{opacity:.72}
/* выходные: зелёная подсветка со стеклом и мягким миганием */
.dcell.wk,.drow.wk{
  position:relative;overflow:hidden;isolation:isolate;
  border:1px solid rgba(var(--green-rgb),.85);
  background:
    linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,0) 48%),
    linear-gradient(160deg,rgba(var(--green-rgb),.42),rgba(22,101,52,.26));
  backdrop-filter:blur(12px) saturate(170%);-webkit-backdrop-filter:blur(12px) saturate(170%);
  animation:wkblink 2.6s ease-in-out infinite;opacity:1;
}
.dcell.wk{box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(0,0,0,.2)}
.drow.wk{box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(0,0,0,.2)}
.dcell.wk::after,.drow.wk::after{
  content:"";position:absolute;top:-40%;left:-70%;width:40%;height:180%;transform:rotate(18deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);
  animation:wksheen 4.2s ease-in-out infinite;pointer-events:none;
}
@keyframes wksheen{0%,55%{left:-70%}100%{left:130%}}
@keyframes wkblink{
  0%,100%{box-shadow:0 0 0 0 rgba(var(--green-rgb),0),inset 0 1px 0 rgba(255,255,255,.28)}
  50%{box-shadow:0 0 22px 2px rgba(var(--green-rgb),.50),inset 0 1px 0 rgba(255,255,255,.34),inset 0 0 0 1px rgba(var(--green-rgb),.55)}
}
.hint{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.mon{font:700 14px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 2px 8px}
.drow{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;margin-bottom:6px;
  border:1px solid var(--edge);background:var(--st-steel);cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07);
  transition:transform .15s ease,border-color .25s ease;
}
.drow:active{transform:scale(.985)}
.drow.today{border-color:var(--ion)}
.drow.sel{background:linear-gradient(160deg,rgba(var(--ion-rgb),.16),var(--st-steel))}
.drow .dt{width:50px;text-align:center;flex:0 0 50px}
.drow .dt b{display:block;font:800 26px/1 "Barlow Condensed",sans-serif}
.drow .dt span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.drow .tm{flex:1;font-variant-numeric:tabular-nums;font-size:16px;font-weight:600}
.drow .tm small{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:2px}
/* блоки маршрутов */
.route .tag{
  float:right;font:700 12px/1 "Barlow Condensed",sans-serif;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ion);border:1px solid var(--ion);border-radius:6px;padding:4px 6px;
}
.route.mine{border-color:rgba(var(--ion-rgb),.55)}
.lbl{color:var(--muted);font-size:13px;margin-top:12px}
.lbl + .bus{margin-top:6px}
.chip{transition:transform .2s ease,border-color .2s ease}
.chip:active{transform:scale(.94)}
.bus{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  font:700 15px/1 "Barlow Condensed",sans-serif;padding:8px 10px;border-radius:8px;
  background:var(--st-steel);border:1px solid var(--edge);font-variant-numeric:tabular-nums;
}
.chip.next{border-color:var(--ion);color:var(--ion)}

.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.metric{background:var(--st-steel);border:1px solid var(--edge);border-radius:14px;padding:12px}
.metric b{display:block;font:800 28px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.metric span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* ---------- нижнее меню: плавающая стеклянная капсула с бегущим индикатором ---------- */
.nav{
  --i:0;
  position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(5,1fr);height:66px;padding:6px;border-radius:24px;
  background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.02) 50%),var(--st-navy);
  border:1px solid var(--edge);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(0,0,0,.2),0 14px 34px rgba(0,0,0,.35);
  backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  z-index:5;
}
.nav .ind{
  position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px) / 5);border-radius:18px;
  transform:translateX(calc(var(--i) * 100%));
  background:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,255,255,.04)),rgba(var(--ion-rgb),.20);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 0 18px rgba(var(--ion-rgb),.28);
  transition:transform .45s cubic-bezier(.3,.9,.3,1);pointer-events:none;
}
.nav button{
  position:relative;z-index:1;appearance:none;border:0;background:transparent;color:var(--muted);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:18px;
  font:700 11px/1 "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase;
  transition:color .3s ease;
}
.nav button svg{
  width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
  transition:transform .35s cubic-bezier(.3,.9,.3,1);
}
.nav button:active svg{transform:scale(.84)}
.nav button.on{color:var(--ion)}
.nav button.on svg{transform:translateY(-1px)}

/* ---------- настройки: переключатели в стиле iOS ---------- */
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--edge)}
.set-row:last-child{border-bottom:0;padding-bottom:0}
.set-row:first-child{padding-top:4px}
.sw{position:relative;display:inline-block;width:51px;height:31px;flex:0 0 51px;cursor:pointer}
.sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:16px;background:rgba(120,120,128,.36);transition:background .3s ease}
.sw i::after{
  content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;
  box-shadow:0 3px 8px rgba(0,0,0,.28),0 1px 1px rgba(0,0,0,.16);
  transition:transform .32s cubic-bezier(.3,.7,.3,1),width .2s ease;
}
.sw input:checked + i{background:var(--ion)}
.sw input:checked + i::after{transform:translateX(20px)}
.sw input:active + i::after{width:31px}
.sw input:checked:active + i::after{transform:translateX(16px)}
.sw input:focus-visible + i{outline:2px solid var(--ion);outline-offset:2px}

/* сегменты: выбор оформления */

.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}

.toast{
  position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--cta);color:var(--cta-ink);
  padding:10px 16px;border-radius:10px;font:700 14px/1 "Barlow Condensed",sans-serif;letter-spacing:.05em;
  opacity:0;pointer-events:none;transition:opacity .25s;text-transform:uppercase;z-index:9;
}
.toast.show{opacity:1}
.err{text-align:center;padding:40px 16px}
.err b{display:block;font:700 22px/1.2 "Barlow Condensed",sans-serif;margin-bottom:8px;text-transform:uppercase}
</style>
</head>
<body>
<main>
  <header class="top">
    <div class="top-l">
      <h1 id="title">Смена</h1>
      <span class="muted" id="who"></span>
    </div>
    <div class="hbtns">
      <button class="ib" id="searchBtn" aria-label="Поиск">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7.5"/><path d="M16.5 16.5L21 21"/></svg>
      </button>
      <button class="ib" id="menuBtn" aria-label="Меню">
        <svg viewBox="0 0 24 24"><path d="M3.5 8h17M3.5 16h17"/></svg>
      </button>
    </div>
  </header>
  <section class="view on" id="v-shift"></section>
  <section class="view" id="v-schedule"></section>
  <section class="view" id="v-shuttle"></section>
  <section class="view" id="v-stats"></section>
  <section class="view" id="v-more"></section>
</main>

<nav class="nav" id="nav">
  <span class="ind"></span>
  <button data-tab="shift" class="on">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>Смена</span></button>
  <button data-tab="schedule">
    <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>График</span></button>
  <button data-tab="shuttle">
    <svg viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="14" rx="3"/><path d="M5 11h14M8.5 20.5v-3M15.5 20.5v-3"/><path d="M9 14.5h.01M15 14.5h.01"/></svg><span>Развозка</span></button>
  <button data-tab="stats">
    <svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.2 4.1 1 5.8L12 16.9l-5.3 2.7 1-5.8-4.2-4.1 5.9-.9z"/></svg><span>Стаж</span></button>
  <button data-tab="more">
    <svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span>Ещё</span></button>
</nav>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
const INIT = tg ? tg.initData : "";
const TITLES = {shift:"Смена", schedule:"График", shuttle:"Развозка", stats:"Стаж", more:"Ещё"};
const ORDER = ["shift","schedule","shuttle","stats","more"];
const MONTHS = ["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
const WD = ["вс","пн","вт","ср","чт","пт","сб"];
const KIND = {"Д":{cls:"day",label:"День"},"Н":{cls:"night",label:"Ночь"},"В":{cls:"off",label:"Выходной"}};
const SET_LABELS = {
  notify_checkin: "Напоминание об отметке",
  beer_enabled: "Опрос «по пиву»",
  show_weather: "Погода в уведомлениях",
  autoclean: "Автоочистка чата",
};

let S = null;          // состояние с сервера
let tab = "shift";
let timer = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hm = (iso) => iso ? iso.slice(11, 16) : "—";           // время уже в часовом поясе пользователя
const ms = (iso) => iso ? Date.parse(iso) - Date.now() : null;

function buzz(kind = "light") { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(kind); } catch (_) {} }
function toast(text) {
  const t = $("toast"); t.textContent = text; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1800);
}

function fmtDelta(ms) {
  if (ms == null || ms < 0) return "00:00:00";
  const s = Math.floor(ms / 1000);
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  const p = (n) => String(n).padStart(2, "0");
  return d ? `${d}д ${p(h)}:${p(m)}:${p(sec)}` : `${p(h)}:${p(m)}:${p(sec)}`;
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: {"Content-Type": "application/json", "X-Init-Data": INIT, ...(opts.headers || {})},
  });
  let data = null;
  try { data = await res.json(); } catch (_) {}
  if (!res.ok) throw new Error((data && data.error) || `HTTP ${res.status}`);
  return data;
}

async function load() {
  try {
    S = await api("/api/state");
    $("who").textContent = S.name ? S.name : "";
    renderAll();
  } catch (e) {
    const msg = {
      auth: "Открой приложение из Telegram — там подпись, без неё данные не отдаём.",
      not_registered: "Сначала настрой график в боте: /start",
    }[e.message] || "Не удалось загрузить данные. Потяни вниз или открой позже.";
    document.querySelectorAll(".view").forEach(v => v.innerHTML = `<div class="card err"><b>Нет доступа</b>${esc(msg)}</div>`);
  }
}

function renderAll() {
  renderShift(); renderSchedule(); renderShuttle(); renderStats(); renderMore();
  startTimer();
}

/* ---------- Смена ---------- */
function badge(kind, extra = "") {
  const k = KIND[kind] || {cls:"off", label:"—"};
  return `<span class="sbadge ${k.cls} ${extra}"><span>${k.label}</span></span>`;
}

function renderShift() {
  const st = S.status;
  const target = st.working ? st.shift_end : st.next_start;
  const head = st.working
    ? `${badge(st.shift_kind)} <span class="muted">до конца ${hm(st.shift_end)}</span>`
    : (st.in_weekend ? `${badge("В")} <span class="muted">выходные</span>`
                     : `${badge(st.next_kind)} <span class="muted">следующая в ${hm(st.next_start)}</span>`);

  let progress = 0;
  if (st.working && st.shift_start && st.shift_end) {
    const a = Date.parse(st.shift_start), b = Date.parse(st.shift_end);
    progress = Math.min(100, Math.max(0, (Date.now() - a) / (b - a) * 100));
  }

  let html = `
    <div class="card">
      ${head}
      <div class="countdown" id="cd">${fmtDelta(ms(target))}</div>
      <div class="muted">${st.working ? "до конца смены" : "до начала смены"}</div>
      ${st.working ? `<div class="bar"><i id="pb" style="width:${progress.toFixed(1)}%"></i></div>` : ""}
    </div>`;

  if (S.weather) {
    html += `<div class="card"><div class="muted">Погода на заводе</div><div style="margin-top:4px">${esc(S.weather.line)}</div><div class="muted" style="margin-top:6px">${esc(S.weather.advice)}</div></div>`;
  }

  if (S.beer) {
    const b = S.beer;
    const mine = b.my_vote;
    html += `
      <div class="card">
        <div class="row"><b class="cond" style="font-size:20px">🍺 После смены</b><span class="muted">${esc(b.place)}</span></div>
        <div class="muted" style="margin-top:6px">${b.yes_count ? esc(b.yes_names.join(", ")) : "Пока никто не ответил"}</div>
        <div class="btns">
          <button class="btn ${mine === true ? "on" : "ghost"}" data-vote="1">Я за</button>
          <button class="btn ${mine === false ? "on" : "ghost"}" data-vote="0">Не в этот раз</button>
        </div>
      </div>`;
  }

  if (S.shuttle && S.shuttle.mine) {
    const sh = S.shuttle.mine;
    const list = st.working ? sh.next_from_work : sh.next_to_work;
    html += `
      <div class="card tap">
        <div class="muted">🚌 ${st.working ? "С завода" : "На смену"} · ${esc(sh.station)}</div>
        <div class="bus" style="margin-top:10px">
          ${list.length ? list.map((t, i) => `<span class="chip ${i === 0 ? "next" : ""}">${hm(t)}</span>`).join("") : `<span class="muted">Рейсов на ближайшее время нет</span>`}
        </div>
      </div>`;
  }

  html += `<div class="btns"><button class="btn" id="markBtn">Отметить смену</button><button class="btn ghost" id="refreshBtn">Обновить</button></div>`;
  $("v-shift").innerHTML = html;
  $("title").textContent = TITLES[tab];
}

/* ---------- График ---------- */
const MONTHS_FULL = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
let selDate = null;

function rowHtml(d, today) {
  const dt = new Date(d.date + "T12:00:00");
  let tm, sub;
  if (d.start && d.end) {
    const hours = Math.round((Date.parse(d.end) - Date.parse(d.start)) / 3600000);
    const nextDay = d.end.slice(0, 10) !== d.date ? " · до утра следующего дня" : "";
    tm = `${hm(d.start)} — ${hm(d.end)}`;
    sub = `${d.kind === "Д" ? "Дневная" : "Ночная"} смена, ${hours} ч${nextDay}`;
  } else {
    tm = "Выходной";
    sub = d.weekend ? "Выходные" : "Отдых";
  }
  return `
    <div class="drow ${d.kind === "В" ? "wk" : ""} ${d.date === today ? "today" : ""} ${d.date === selDate ? "sel" : ""}" data-date="${d.date}">
      <div class="dt"><span>${WD[dt.getDay()]}</span><b>${dt.getDate()}</b><span>${MONTHS[dt.getMonth()]}</span></div>
      <div class="tm">${tm}<small>${sub}</small></div>
      ${badge(d.kind, d.kind === "В" ? "" : "glow")}
    </div>`;
}

function renderSchedule() {
  const cal = S.calendar || [];
  const today = S.today || (cal[0] && cal[0].date) || "";
  if (!selDate || !cal.some(d => d.date === selDate)) selDate = today;

  const cells = cal.map(d => {
    const k = KIND[d.kind] || {cls: "off"};
    const dt = new Date(d.date + "T12:00:00");
    return `
      <div class="dcell ${k.cls}-k ${d.kind === "В" ? "wk" : ""} ${d.date === today ? "today" : ""} ${d.date === selDate ? "sel" : ""}" data-date="${d.date}">
        <span class="muted">${WD[dt.getDay()]}</span>
        <b>${dt.getDate()}</b>
        <span class="muted">${MONTHS[dt.getMonth()]}</span>
        <div>${badge(d.kind, d.kind === "В" ? "" : "glow")}</div>
      </div>`;
  }).join("");

  const byMonth = [];
  cal.forEach(d => {
    const key = d.date.slice(0, 7);
    let g = byMonth.find(x => x.key === key);
    if (!g) { g = {key, days: []}; byMonth.push(g); }
    g.days.push(d);
  });
  const list = byMonth.map(g => {
    const [y, m] = g.key.split("-");
    return `<div class="mon">${MONTHS_FULL[+m - 1]} ${y}</div>` + g.days.map(d => rowHtml(d, today)).join("");
  }).join("");

  $("v-schedule").innerHTML = `
    <div class="card">
      <div class="hint"><span class="muted">${cal.length} дней вперёд</span><span class="muted">листай →</span></div>
      <div class="strip" id="strip">${cells}</div>
    </div>
    <div class="muted" style="margin:6px 2px 0">Все смены по дням · <span style="color:var(--ion)">●</span> день · <span style="color:var(--night)">●</span> ночь · <span style="color:rgb(var(--green-rgb))">●</span> выходной</div>
    ${list}`;

  const strip = $("strip");
  strip.addEventListener("wheel", (e) => {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { strip.scrollLeft += e.deltaY; e.preventDefault(); }
  }, {passive: false});
}

function selectDay(date) {
  selDate = date;
  buzz();
  document.querySelectorAll("#v-schedule .dcell").forEach(el => el.classList.toggle("sel", el.dataset.date === date));
  document.querySelectorAll("#v-schedule .drow").forEach(el => el.classList.toggle("sel", el.dataset.date === date));
  const cell = document.querySelector(`#v-schedule .dcell[data-date="${date}"]`);
  if (cell) cell.scrollIntoView({behavior: "smooth", inline: "center", block: "nearest"});
  const row = document.querySelector(`#v-schedule .drow[data-date="${date}"]`);
  if (row) row.scrollIntoView({behavior: "smooth", block: "center"});
}

/* ---------- Развозка ---------- */
function routeHtml(r) {
  const chips = (arr) => arr.length
    ? arr.map(t => `<span class="chip">${t}</span>`).join("")
    : `<span class="muted">Рейсов нет</span>`;
  return `
    <div class="card tap route ${r.is_mine ? "mine" : ""}">
      ${r.is_mine ? `<span class="tag">моя</span>` : ""}
      <div class="cond" style="font-size:20px">${esc(r.title)}</div>
      <div class="lbl">Со станции на завод</div>
      <div class="bus">${chips(r.to_work_today)}</div>
      <div class="lbl">С завода на станцию</div>
      <div class="bus">${chips(r.from_work_today)}</div>
    </div>`;
}

function renderShuttle() {
  const sh = S.shuttle;
  if (!sh || !sh.routes || !sh.routes.length) {
    $("v-shuttle").innerHTML = `<div class="card err"><b>Развозка не настроена</b>Проверь расписание на сервере</div>`;
    return;
  }
  const wk = sh.routes[0].is_weekend ? "выходные" : "будни";
  let html = `<div class="muted" style="margin:0 2px 12px">Расписание на ${wk} · все станции</div>`;

  if (sh.mine) {
    const m = sh.mine;
    const list = S.status.working ? m.next_from_work : m.next_to_work;
    html += `
      <div class="card">
        <div class="muted">Твоя станция · ${esc(m.station)}</div>
        <div class="lbl">${S.status.working ? "Ближайшие с завода" : "Ближайшие на смену"}</div>
        <div class="bus">${list.length
          ? list.map((t, i) => `<span class="chip ${i === 0 ? "next" : ""}">${hm(t)}</span>`).join("")
          : `<span class="muted">Рейсов на ближайшее время нет</span>`}</div>
      </div>`;
  } else {
    html += `<div class="card muted">Станция не выбрана. Выбери её в боте: /nastroiki</div>`;
  }

  html += sh.routes.map(routeHtml).join("");
  $("v-shuttle").innerHTML = html;
}

/* ---------- Стаж ---------- */
function renderStats() {
  const s = S.stats;
  if (!s) {
    $("v-stats").innerHTML = `<div class="card err"><b>Стаж не посчитан</b>Укажи дату устройства: /ustroilsya 15.03.2024</div>`;
    return;
  }
  const rate = s.planned_shifts ? Math.round(s.rate * 100) : 0;
  $("v-stats").innerHTML = `
    <div class="card">
      <div class="muted">Стаж</div>
      <div class="countdown">${s.years ? s.years + " л " : ""}${s.months} м ${s.days} д</div>
      <div class="muted">с ${s.hired.split("-").reverse().join(".")} · всего ${s.total_days} дн.</div>
    </div>
    <div class="metrics">
      <div class="metric"><b>${s.worked_shifts}</b><span>отработано смен</span></div>
      <div class="metric"><b>${Math.round(s.worked_hours)}</b><span>часов</span></div>
      <div class="metric"><b>${s.missed_shifts ?? 0}</b><span>пропусков</span></div>
      <div class="metric"><b>${rate}%</b><span>посещаемость</span></div>
    </div>
    ${s.unconfirmed ? `<div class="card" style="margin-top:12px"><span class="sbadge warn"><span>Не отмечено</span></span> <span class="muted">${s.unconfirmed} смен без отметки</span></div>` : ""}`;
}

/* ---------- Ещё: оформление и настройки бота ---------- */
function renderMore() {
  const cfg = S.settings || {};
  const rows = Object.keys(SET_LABELS).map(k => `
    <div class="set-row">
      <span>${SET_LABELS[k]}</span>
      <label class="sw"><input type="checkbox" data-set="${k}" ${cfg[k] ? "checked" : ""}><i></i></label>
    </div>`).join("");
  $("v-more").innerHTML = `
    <div class="card">
      <div class="muted" style="margin-bottom:4px">Настройки бота</div>
      ${rows}
    </div>
    <div class="muted" style="margin:0 4px">Переключатели сразу меняют настройки в боте.</div>`;
}

async function saveSetting(input) {
  const key = input.dataset.set, val = input.checked;
  buzz();
  S.settings = S.settings || {};
  S.settings[key] = val;
  try {
    await api("/api/settings", {method: "POST", body: JSON.stringify({[key]: val})});
    toast("Сохранил");
  } catch (e) {
    input.checked = !val;
    S.settings[key] = !val;
    toast("Не сохранилось, попробуй ещё");
  }
}

/* ---------- таймер и события ---------- */
function startTimer() {
  clearInterval(timer);
  timer = setInterval(() => {
    if (!S) return;
    const st = S.status;
    const target = st.working ? st.shift_end : st.next_start;
    const el = $("cd");
    if (el && tab === "shift") el.textContent = fmtDelta(ms(target));
  }, 1000);
}

async function vote(yes) {
  if (!S || !S.beer) return;
  buzz("medium");
  try {
    await api("/api/beer/vote", {method: "POST", body: JSON.stringify({event_id: S.beer.event_id, yes})});
    toast(yes ? "Записал: ты за" : "Записал: в этот раз мимо");
    await load();
  } catch (e) { toast("Не получилось, попробуй ещё"); }
}

function markToday() {
  buzz();
  const labels = {worked:"Отработал", sick:"Больничный", absent:"Прогул", dayoff:"Выходной", vacation:"Отпуск"};
  const send = async (status) => {
    try {
      await api("/api/mark", {method: "POST", body: JSON.stringify({status})});
      toast(labels[status] + " — записал");
      await load();
    } catch (e) { toast(e.message === "no_shift" ? "Смены не нашёл" : "Не получилось"); }
  };
  if (tg && tg.showPopup) {
    tg.showPopup({
      title: "Отметка по смене",
      message: "Что отмечаем?",
      buttons: [
        {id: "worked", type: "default", text: "Отработал"},
        {id: "sick", type: "default", text: "Больничный"},
        {id: "absent", type: "destructive", text: "Прогул"},
        {type: "cancel"},
      ],
    }, (id) => { if (id) send(id); });
  } else {
    send("worked");
  }
}

function switchTab(name) {
  tab = name;
  document.querySelectorAll(".view").forEach(v => v.classList.remove("on"));
  $("v-" + name).classList.add("on");
  document.querySelectorAll(".nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === name));
  $("nav").style.setProperty("--i", ORDER.indexOf(name));
  $("title").textContent = TITLES[name];
  buzz("light");
  window.scrollTo({top: 0, behavior: "smooth"});
}

document.getElementById("nav").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-tab]");
  if (b) switchTab(b.dataset.tab);
});
document.getElementById("menuBtn").addEventListener("click", () => { buzz(); switchTab("more"); });
document.getElementById("searchBtn").addEventListener("click", () => { buzz(); toast("Поиск пока не подключён"); });
document.getElementById("v-schedule").addEventListener("click", (e) => {
  const d = e.target.closest("[data-date]");
  if (d) selectDay(d.dataset.date);
});
document.getElementById("v-shift").addEventListener("click", (e) => {
  const v = e.target.closest("[data-vote]");
  if (v) return vote(v.dataset.vote === "1");
  if (e.target.id === "markBtn") return markToday();
  if (e.target.id === "refreshBtn") { buzz(); return load(); }
});
document.getElementById("v-more").addEventListener("change", (e) => {
  const i = e.target.closest("input[data-set]");
  if (i) saveSetting(i);
});

if (tg) { tg.ready(); tg.expand(); }
$("title").textContent = TITLES[tab];
$("nav").style.setProperty("--i", 0);
load();
</script>
</body>
</html>
